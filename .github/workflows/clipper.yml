name: Clipper Casa de Alofoke 3

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
  push:
    paths:
      - "alofoke-clipper.zip"
      - ".github/workflows/clipper.yml"

permissions:
  contents: write

jobs:
  instalar:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir el zip y subir los archivos
        run: |
          if [ ! -f alofoke-clipper.zip ]; then echo "Falta subir alofoke-clipper.zip"; exit 0; fi
          unzip -oq alofoke-clipper.zip -d /tmp/z
          rm -rf /tmp/z/alofoke-clipper/.github
          cp -r /tmp/z/alofoke-clipper/. .
          git rm -q alofoke-clipper.zip
          git config user.name "bot-alofoke"
          git config user.email "bot-alofoke@users.noreply.github.com"
          git add -A
          git commit -qm "Instalar archivos del bot"
          git push

  clip:
    if: github.event_name != 'push'
    concurrency:
      group: clipper
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar ffmpeg y fuentes
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Instalar dependencias
        run: pip install -U -r requirements.txt
      - name: Instalar Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Actualizar yt-dlp y EJS
        run: python -m pip install -U "yt-dlp[default]"
      - name: Verificar instalaciones
        run: |
          python --version
          deno --version
          python -m yt_dlp --version
          python -m pip show yt-dlp-ejs
          ffmpeg -version
      - name: Diagnosticar yt-dlp
        if: ${{ vars.DRIVE_CARPETA == '' }}
        continue-on-error: true
        timeout-minutes: 3
        env:
          CANAL_LIVE_URL: ${{ vars.CANAL_LIVE_URL }}
        run: |
          URL="${CANAL_LIVE_URL:-https://www.youtube.com/watch?v=Dxi1CRMQZo}"
          python -m yt_dlp \
            --js-runtimes deno \
            --socket-timeout 30 \
            --retries 2 \
            -v -F "$URL"
      - name: Instalar Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Instalar Codex
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          if [ -n "$CODEX_AUTH_JSON" ]; then
            npm install -g @openai/codex
            mkdir -p ~/.codex
            printf '%s' "$CODEX_AUTH_JSON" > ~/.codex/auth.json
            chmod 600 ~/.codex/auth.json
          fi
      - name: Cache del modelo Whisper
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ vars.WHISPER_MODELO || 'small' }}
      - name: Correr el bot
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          FB_PAGINAS: ${{ secrets.FB_PAGINAS }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELO: ${{ vars.GEMINI_MODELO }}
          GEMINI_ALTERNATIVOS: ${{ vars.GEMINI_ALTERNATIVOS }}
          DRIVE_CARPETA: ${{ vars.DRIVE_CARPETA }}
          CANAL_LIVE_URL: ${{ vars.CANAL_LIVE_URL }}
          MAX_POR_DIA: "15"
          PUNTAJE_MINIMO: "7"
          WHISPER_MODELO: ${{ vars.WHISPER_MODELO }}
          MODO_PRUEBA: ${{ vars.MODO_PRUEBA }}
          ENVIAR_TODOS_TELEGRAM: "1"
          ELEGIDORES: ${{ vars.ELEGIDORES }}
          SEGMENTO_SEG: ${{ vars.SEGMENTO_SEG }}
          CLIPS_POR_SEGMENTO: ${{ vars.CLIPS_POR_SEGMENTO }}
          PYTHONUNBUFFERED: "1"
        run: python -u main.py
